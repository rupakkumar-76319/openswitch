[project]
name = "openswitch"
version = "0.1.0"
description = "Coding agent that migrates an app's OpenAI/Anthropic calls to NVIDIA Nemotron on Nebius Token Factory and proves it still works."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "tavily-python>=0.5", "rich>=13", "python-dotenv>=1.0", "pytest>=8"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
openswitch = "openswitch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openswitch"]
